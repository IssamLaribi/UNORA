<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unora – Know the people next door</title>
<meta name="description" content="Unora is a private space for your building, neighborhood or dormitory. Coming soon for Android and iOS.">
<meta name="theme-color" content="#F3F1EC">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{--paper:#F3F1EC;--ink:#14151A;--mute:#62646C;--line:#D8D5CC;--accent:#3A33D6;--night:#101126;--serif:'Instrument Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
:lang(ar){--serif:'Noto Naskh Arabic','Instrument Serif',serif;--sans:'IBM Plex Sans Arabic','Hanken Grotesk',sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:400 17px/1.65 var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.w{max-width:1160px;margin:0 auto;padding:0 28px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:400}
:lang(ar) h1,:lang(ar) h2,:lang(ar) h3,:lang(ar) .serif{font-weight:600}
h1{font-size:clamp(3.2rem,7.5vw,6.4rem);line-height:.98;letter-spacing:-.02em}
h2{font-size:clamp(2.2rem,4.4vw,3.6rem);line-height:1.08;letter-spacing:-.015em;max-width:15em}
:lang(ar) h1{line-height:1.3;letter-spacing:0}:lang(ar) h2{line-height:1.35;letter-spacing:0}
.eyebrow{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500}
:lang(ar) .eyebrow{letter-spacing:0;text-transform:none;font-size:.9rem}
/* nav */
nav{position:fixed;inset:0 0 auto;z-index:10;background:rgba(243,241,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.s{border-color:var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 1.7rem/1 'Instrument Serif',serif;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.links{display:flex;gap:32px;font-size:.95rem;list-style:none;padding:0}
.links a{text-decoration:none;color:var(--mute);transition:color .2s}.links a:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:16px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:.82rem;font-weight:500;color:var(--mute);font-family:'Hanken Grotesk','IBM Plex Sans Arabic',sans-serif}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{display:inline-block;padding:11px 22px;border-radius:99px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;font-weight:500;font-size:.95rem;transition:background .2s,color .2s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
/* hero */
.hero{padding:140px 0 90px}
.hero .w{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.status{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.lead{font-size:1.18rem;color:var(--mute);max-width:32em;margin:28px 0 36px}
.stores{display:flex;gap:12px;flex-wrap:wrap}
.store{border:1px solid var(--ink);border-radius:12px;padding:10px 20px;min-width:164px}
.store small{display:block;font-size:.72rem;color:var(--mute);line-height:1.3}.store b{font-weight:500;font-size:1.05rem}
.panel{background:var(--accent);border-radius:28px;height:620px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;position:relative}
.panel:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid rgba(255,255,255,.22);top:60px}
.panel:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;border:1px solid rgba(255,255,255,.22);top:150px}
.phone{position:relative;z-index:1;width:290px;background:var(--ink);border-radius:42px 42px 0 0;padding:10px 10px 0;margin-bottom:-90px}
.screen{background:var(--paper);border-radius:34px 34px 0 0;height:520px;padding:22px 18px;color:var(--ink);font-size:.86rem;line-height:1.45}
.screen header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
.screen header b{font:400 1.35rem var(--serif)}.screen header span{font-size:.75rem;color:var(--mute)}
.post{padding:16px 0;border-bottom:1px solid var(--line);transition:opacity .45s}
.post.f{opacity:0}
.post .t{display:inline-block;font-size:.7rem;border:1px solid var(--ink);border-radius:99px;padding:2px 10px;margin-bottom:10px;font-weight:500}
.post .m{font-size:.75rem;color:var(--mute);margin-top:8px}
.ghost{color:var(--mute);opacity:.55}
/* sections */
section{padding:120px 0}
.rule{border-top:1px solid var(--line)}
.head{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;margin-bottom:64px;align-items:end}
.head p{color:var(--mute);font-size:1.1rem;max-width:30em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.step{border-top:1px solid var(--ink);padding-top:20px}
.step .n{font:400 1.2rem var(--serif);color:var(--accent)}
.step h3{font-size:1.9rem;margin:34px 0 10px;line-height:1.15}.step p{color:var(--mute)}
/* categories */
.acc{list-style:none;padding:0;border-top:1px solid var(--ink)}
.acc li{border-bottom:1px solid var(--line)}
.acc .row{display:grid;grid-template-columns:70px 1fr 24px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:26px 0}
.acc .num{font:400 1rem var(--serif);color:var(--mute)}
.acc .ti{font:400 clamp(1.7rem,3.4vw,2.6rem)/1.15 var(--serif);transition:color .2s,transform .3s}
:lang(ar) .acc .ti{font-weight:600}
.acc .row:hover .ti,.acc [aria-expanded=true] .ti{color:var(--accent)}
.acc .row:hover .ti{transform:translateX(6px)}[dir=rtl] .acc .row:hover .ti{transform:translateX(-6px)}
.acc .pl{width:14px;height:14px;position:relative}
.acc .pl:before,.acc .pl:after{content:"";position:absolute;background:var(--ink);transition:transform .3s}
.acc .pl:before{left:0;right:0;top:6.5px;height:1px}.acc .pl:after{top:0;bottom:0;left:6.5px;width:1px}
.acc [aria-expanded=true] .pl:after{transform:scaleY(0)}
.acc .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}
.acc .open .bd{grid-template-rows:1fr}
.acc .bd>div{overflow:hidden;padding-inline-start:70px}
.acc .bd p{color:var(--mute);max-width:34em}
.acc .bd q{display:block;margin:14px 0 30px;font:italic 1.25rem/1.4 var(--serif);color:var(--ink);quotes:none;border-inline-start:2px solid var(--accent);padding-inline-start:16px;max-width:30em}
:lang(ar) .acc .bd q{font-style:normal;font-family:var(--sans)}
.sub{margin:48px 0 14px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--ink)}
.bg{padding:28px 24px 28px 0;border-inline-end:1px solid var(--line);padding-inline:0 24px;margin-inline-end:24px}
.bg:last-child{border:0}
.sh{display:block;width:52px;height:52px;background:var(--accent);margin-bottom:26px;transition:transform .5s}
.bg:hover .sh{transform:rotate(90deg)}
.s1{border-radius:50%}.s2{border-radius:12px}.s3{clip-path:polygon(50% 4%,96% 92%,4% 92%)}.s4{border-radius:50% 50% 0 0;height:30px;margin-top:22px}
.bg h3{font-size:1.6rem;line-height:1.2}.bg p{color:var(--mute);font-size:.95rem;margin-top:6px}
/* privacy */
.night{background:var(--night);color:#ECEAF5;border-radius:36px;margin:0 14px}
.night h2{color:#fff}
.pv{list-style:none;padding:0;border-top:1px solid rgba(255,255,255,.25)}
.pv li{display:grid;grid-template-columns:1fr 1.4fr;gap:32px;padding:30px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.pv h3{font-size:1.7rem}.pv p{color:#A8A6C2}
/* cta */
.cta .w{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:end}
form{display:flex;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:10px}
input{flex:1;min-width:0;background:none;border:0;font:inherit;font-size:1.1rem;color:var(--ink);padding:8px 0}
input:focus{outline:none}form:focus-within{border-color:var(--accent)}
#msg{margin-top:14px;color:var(--accent);min-height:1.6em;font-size:.95rem}
.cta p.sb{color:var(--mute);margin-top:20px;max-width:28em}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:.9rem}
footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.js .rv{opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s}.js .rv.in{opacity:1;transform:none}
@media(max-width:900px){.hero .w,.head,.cta .w,.pv li{grid-template-columns:1fr}.links,nav .btn{display:none}.steps{grid-template-columns:1fr}.badges{grid-template-columns:1fr 1fr}.bg:nth-child(2){border:0}.panel{height:540px}section{padding:84px 0}.hero{padding-top:110px}.acc .row{grid-template-columns:44px 1fr 24px}.acc .bd>div{padding-inline-start:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.js .rv{opacity:1;transform:none}}

/* ---- v4: color, icons, illustration ---- */
:root{--sun:#F2B33D;--mint:#BFE3D0;--sky:#C9DDF4;--peach:#F6C5B5}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;flex:none}
.panel:before,.panel:after{display:none}
.scene{position:absolute;inset:0;width:100%;height:100%}
.tw{animation:tw 3.6s ease-in-out infinite}.tw:nth-child(3n){animation-delay:-1.2s}.tw:nth-child(5n){animation-delay:-2.4s}
@keyframes tw{50%{opacity:.25}}
.arc{fill:none;stroke:#fff;stroke-opacity:.7;stroke-width:1.6;stroke-dasharray:3 7;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.mq{background:var(--ink);color:var(--paper);overflow:hidden;padding:18px 0}
.mq div{display:flex;width:max-content;animation:mq 60s linear infinite}
.mq span{display:flex;align-items:center;white-space:nowrap;font:400 1.5rem var(--serif)}
:lang(ar) .mq span{font-weight:500}
.mq i{display:block;width:10px;height:10px;background:var(--sun);transform:rotate(45deg);margin:0 36px}
@keyframes mq{to{transform:translateX(-50%)}}
[dir=rtl] .mq div{animation-name:mqr}@keyframes mqr{to{transform:translateX(50%)}}
.step{border-top:0;background:#fff;border-radius:28px;padding:28px}
.step .top{display:flex;justify-content:space-between;align-items:center}
.step .n{font-size:1.4rem;color:var(--mute)}
.k1{background:var(--sun)}.k2{background:var(--mint)}.k3{background:var(--sky)}
.step h3{margin-top:28px}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.bento+.sub+.bento,.sub{margin-top:20px}
.sub{margin-top:44px;margin-bottom:6px}
.card{border-radius:30px;padding:32px;display:flex;flex-direction:column;gap:14px;min-height:310px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px) rotate(-.5deg)}
.card .ib{border-radius:18px;background:var(--ink);color:var(--paper)}
.card h3{font-size:2.1rem;line-height:1.1}.card p{color:rgba(20,21,26,.72);max-width:26em}
.bub{margin-top:auto;background:#fff;color:var(--ink);border-radius:20px 20px 20px 4px;padding:14px 18px;font-size:.95rem;line-height:1.45}
[dir=rtl] .bub{border-radius:20px 20px 4px 20px}
.c1{background:var(--sun)}.c2{background:var(--mint)}.c3{background:var(--sky)}.c4{background:var(--peach)}
.c5,.c6{background:var(--accent);color:#fff;min-height:270px}.c5 p,.c6 p{color:rgba(255,255,255,.8)}.c5 .ib,.c6 .ib{background:#fff;color:var(--accent)}
.badges{border:0;gap:20px}
.bg{background:#fff;border:0!important;border-radius:26px;padding:28px;margin:0;transition:transform .3s}
.bg:hover{transform:translateY(-6px)}.bg:hover .ib{transform:rotate(-8deg) scale(1.08)}.bg .ib{margin-bottom:26px;transition:transform .3s}
.bc1{background:var(--peach)}.bc2{background:var(--sun)}.bc3{background:var(--sky)}.bc4{background:var(--mint)}
.ph2{display:flex;align-items:center;gap:18px}
.pv .ib{width:50px;height:50px;border:1px solid rgba(255,255,255,.3);color:var(--sun)}
.cta .w{background:var(--sun);border-radius:36px;padding:72px 56px;position:relative;overflow:hidden;max-width:1104px}
.cta .w>*{position:relative;z-index:1}
.cta .w:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:var(--accent);inset-inline-end:-110px;top:-130px}
.cta .w:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid var(--ink);inset-inline-start:-40px;bottom:-50px}
.cta p.sb{color:rgba(20,21,26,.75)}
.cta form:focus-within{border-color:var(--accent)}
@media(max-width:900px){.bento{grid-template-columns:1fr}.cta .w{padding:48px 28px}.card{min-height:0}}
@media(prefers-reduced-motion:reduce){.tw,.arc,.mq div{animation:none!important}}
</style>
</head>

</defs></svg>
<nav id="nav"><div class="w">
<a class="brand" href="#top" aria-label="Unora"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#14151A"/><path d="M18 14v18a14 14 0 0 0 28 0V14" fill="none" stroke="#F3F1EC" stroke-width="8" stroke-linecap="round"/><circle cx="32" cy="25" r="5.5" fill="#8C88FF"/></svg>unora</a>

<div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="ar" lang="ar">العربية</button></div>

</div></div></nav>

<div>
<div class="status eyebrow"><i></i><span data-i="pill"></span></div>

}

function setLang(l){

 document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';

 $$('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);

 build();feed(false);
 try{localStorage.setItem('unora-lang',l)}catch(e){}
}
